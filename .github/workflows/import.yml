name: Import site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download zip and extract
        run: |
          set -e
          curl -L --fail --retry 3 -o /tmp/site.zip "https://tmpfiles.org/dl/1794286309.70561e04bcb6eb69/wEAiW5XfMKo8/techreel-v6.zip"
          mkdir -p /tmp/unpack
          unzip -q /tmp/site.zip -d /tmp/unpack
          rsync -a --exclude '.git' --exclude '.github' /tmp/unpack/techreel/ ./
      - name: Commit and push
        run: |
          git config user.name "kaxhu707"
          git config user.email "kaxhu707@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Remove leftover empty GPT 250px ad boxes"
          git push
